<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        // Suppress Vite HMR WebSocket connection errors in iframe / preview environments
        function shouldSuppress(msg, src) {
          msg = String(msg || '');
          src = String(src || '');
          return (
            msg.indexOf('Script error') !== -1 ||
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('closed without opened') !== -1 ||
            src.indexOf('@vite/client') !== -1
          );
        }

        var prevOnError = window.onerror;
        window.onerror = function(msg, src, line, col, err) {
          if (shouldSuppress(msg, src) || (err && shouldSuppress(err.message, err.stack))) {
            return true; // Suppress reporting to browser error monitors
          }
          if (typeof prevOnError === 'function') {
            return prevOnError.apply(this, arguments);
          }
          return false;
        };

        window.addEventListener(
          'unhandledrejection',
          function(e) {
            var reason = e && e.reason;
            var msg = (reason && (reason.message || String(reason))) || '';
            var stack = (reason && reason.stack) || '';
            if (shouldSuppress(msg, stack)) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          },
          true
        );

        window.addEventListener(
          'error',
          function(e) {
            var msg = e && e.message;
            var filename = e && e.filename;
            if (shouldSuppress(msg, filename)) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          },
          true
        );
      })();
    </script>
